# DataPro 密钥示例（I06）：复制为 secret.yaml，替换所有 CHANGE_ME 后 apply。
# 不要把真实密钥提交到仓库；生产建议用 External Secrets / Sealed Secrets / 云密钥管理。
apiVersion: v1
kind: Secret
metadata:
  name: datapro-secrets
  namespace: datapro
type: Opaque
stringData:
  # 数据源与业务库（DATABASE_URL 内嵌密码，所以放 Secret 而不是 ConfigMap）
  DATA_SOURCE_URL: mysql+pymysql://ro:CHANGE_ME@mysql.example.com:3306/dwd_shop
  APP_DATABASE_URL: mysql+pymysql://datapro:CHANGE_ME@mysql.example.com:3306/datapro
  # 数据源库：来源/数据集/字段映射/批次/坏行；建议用单独账号，只授权该库
  SOURCE_DATABASE_URL: mysql+pymysql://datapro:CHANGE_ME@mysql.example.com:3306/datapro_source
  REDIS_URL: redis://:CHANGE_ME@redis.example.com:6379/0

  # 认证
  AUTH_SECRET: CHANGE_ME_random_32_bytes
  AUTH_SEED_ADMIN_PASSWORD: CHANGE_ME_admin
  AUTH_SEED_USER_PASSWORD: CHANGE_ME_user

  # LLM（DeepSeek 或其它 openai 兼容服务）
  # 管理端模型条目只存引用（env:LLM_API_KEY 等），真实 Key 只出现在这里（K8s 注入）
  LLM_API_KEY: sk-CHANGE_ME

  # KMS（可选）：配置后管理端可用 kms:// 引用（内置 Vault KV 后端）
  # SECRET_KMS_URL: https://vault.example.com:8200
  # SECRET_KMS_MOUNT: secret
  # SECRET_KMS_KV_VERSION: "2"
  VAULT_TOKEN: ""

  # Langfuse（可选；不填则 no-op）
  LANGFUSE_HOST: https://cloud.langfuse.com
  LANGFUSE_PUBLIC_KEY: ""
  LANGFUSE_SECRET_KEY: ""

  # 巡检告警（可选；留空只记日志）
  INSPECTION_WEBHOOK_URL: ""
  INSPECTION_WEBHOOK_TYPE: auto
  INSPECTION_WEBHOOK_SECRET: ""

  # 向量召回（可选；Milvus 就绪后把 ConfigMap 的 VECTOR_RECALL_ENABLED 改 true）
  MILVUS_URI: http://milvus.example.com:19530
