name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        working-directory: datapro
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]" || pip install -e .
          pip install pytest pytest-asyncio
      - name: Unit tests
        working-directory: datapro
        env:
          LLM_MOCK: "true"
          AUTH_SECRET: "ci-secret"
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: datapro/frontend/package-lock.json
      - name: Install and build
        working-directory: datapro/frontend
        run: |
          npm ci || npm install
          npm run build
      - name: Unit tests
        working-directory: datapro/frontend
        run: npm test
