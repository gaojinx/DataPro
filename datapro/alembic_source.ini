# Alembic config for the DATA SOURCE database (datapro_source).
# URL is read from app.config in alembic_source/env.py, so no credentials here.
# Keep this file ASCII-only: configparser reads it with the system locale (GBK on Windows).
[alembic]
script_location = alembic_source
prepend_sys_path = .
version_path_separator = os
